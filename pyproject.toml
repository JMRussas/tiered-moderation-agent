[project]
name = "tiered-moderation-agent"
version = "0.1.0"
description = "A live-chat moderation pipeline where the agent is the last resort, not the default"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
llm = [
    "langchain>=1.3.10",
    "langchain-ollama>=1.0.0",
]

# Installed by a bare `uv sync`, so the quickstart works in one command.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "evals"]
testpaths = ["tests"]
